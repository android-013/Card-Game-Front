<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Card game</title>
  <script src="https://aziz-rifat.website/details.js"></script>
  <style>
    .game-info{display:flex;justify-content:center;gap:1rem;margin:20px 0;padding:0;font-family:Arial,sans-serif}
    .game-info p{margin:0;font-size:18px;font-weight:700;color:#000}
    .game-info div{display:flex;justify-content:center;align-items:center;padding:10px 20px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.1);background-color:#007bff}
    #rb{display:block;margin:20px auto;padding:10px 20px;font-size:18px;background-color:#007bff;color:#fff;border:none;border-radius:5px;cursor:pointer}
    #rb:hover{background-color:#005cbd}
    *{margin:0;padding:0;box-sizing:border-box}
    .container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:linear-gradient(180deg,#686de0,#130f40);width:100%;gap:1rem;transition:all .3s;user-select:none}
    .row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:1rem;transition:all .3s}
    .item{display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#7ed6df,#22a6b3);border-radius:1rem;box-shadow:0 0 10px rgba(0,0,0,.1);cursor:pointer;transition:.3s;font-weight:700;color:rgba(0,0,0,.8);width:5rem;height:8rem;font-size:2rem;transition:all .3s}
    .done{background:#fff}
    @media (max-width:768px){
      .item{width:4rem;height:6rem;font-size:1.5rem;border-radius:7.5px}
      .container{gap:.5rem}
      .row{gap:.5rem}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-info">
      <div><p>The Attempts: <span id="x">0</span></p></div>
      <div><p>Pairs Solved: <span id="y">0</span></p></div>
    </div>

    <div class="row">
      <div id="q1"  class="item" onclick="f(this,1)"></div>
      <div id="q2"  class="item" onclick="f(this,2)"></div>
      <div id="q3"  class="item" onclick="f(this,3)"></div>
      <div id="q4"  class="item" onclick="f(this,4)"></div>
      <div id="q5"  class="item" onclick="f(this,5)"></div>
    </div>
    <div class="row">
      <div id="q6"  class="item" onclick="f(this,6)"></div>
      <div id="q7"  class="item" onclick="f(this,7)"></div>
      <div id="q8"  class="item" onclick="f(this,8)"></div>
      <div id="q9"  class="item" onclick="f(this,9)"></div>
      <div id="q10" class="item" onclick="f(this,10)"></div>
    </div>
    <div class="row">
      <div id="q11" class="item" onclick="f(this,11)"></div>
      <div id="q12" class="item" onclick="f(this,12)"></div>
      <div id="q13" class="item" onclick="f(this,13)"></div>
      <div id="q14" class="item" onclick="f(this,14)"></div>
      <div id="q15" class="item" onclick="f(this,15)"></div>
    </div>
    <div class="row">
      <div id="q16" class="item" onclick="f(this,16)"></div>
      <div id="q17" class="item" onclick="f(this,17)"></div>
      <div id="q18" class="item" onclick="f(this,18)"></div>
      <div id="q19" class="item" onclick="f(this,19)"></div>
      <div id="q20" class="item" onclick="f(this,20)"></div>
    </div>

    <button id="rb" onclick="r()">Restart</button>
  </div>

  <script defer>
    (() => {
      const z = ['😊','😊','😎','😎','😍','😍','😜','😜','😁','😁','😅','😅','😂','😂','😆','😆','😇','😇','🤩','🤩'];

      let a = null, b = null, x0 = 0, y0 = 0, k = false;

      const X = document.getElementById('x');
      const Y = document.getElementById('y');
      const R = document.getElementById('rb');

      function s(t){
        for(let i=t.length-1;i>0;i--){
          const j = (Math.random()*(i+1))|0;
          [t[i],t[j]]=[t[j],t[i]];
        }
      }

      s(z);

      window.f = function (e, n) {
        if (k || e.classList.contains('done') || e.innerText) return;

        e.innerText = z[n - 1];

        if (a === null) {
          a = e;
          return;
        }

        b = e;
        k = true;

        x0++;
        X.textContent = x0;

        if (a.innerText === b.innerText) {
          setTimeout(() => {
            a.classList.add('done');
            b.classList.add('done');
            a = null; b = null;

            y0++;
            Y.textContent = y0;

            if (y0 === z.length / 2) {
              R.textContent = 'Play Again';
              alert('Congratulations! You solved all pairs.');
            }
            k = false;
          }, 500);
        } else {
          setTimeout(() => {
            a.innerText = '';
            b.innerText = '';
            a = null; b = null;
            k = false;
          }, 1000);
        }
      };

      // restartGame -> r
      window.r = function () {
        s(z);
        document.querySelectorAll('.item').forEach(v => {
          v.innerText = '';
          v.classList.remove('done');
        });

        a = null; b = null; x0 = 0; y0 = 0; k = false;

        X.textContent = x0;
        Y.textContent = y0;
        R.textContent = 'Restart';
      };
    })();
  </script>
</body>
</html>
